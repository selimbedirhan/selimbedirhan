<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selim Bedirhan Öztürk banner">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="a" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#g)"/>

  <!-- abstract blobs -->
  <circle cx="200" cy="260" r="140" fill="url(#a)" filter="url(#blur)"/>
  <circle cx="900" cy="80" r="160" fill="url(#a)" filter="url(#blur)"/>
  <circle cx="600" cy="200" r="110" fill="url(#a)" filter="url(#blur)" opacity="0.8"/>

  <g fill="#e2e8f0">
    <text x="50%" y="45%" text-anchor="middle" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700">
      Selim Bedirhan Öztürk
    </text>
    <text x="50%" y="67%" text-anchor="middle" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" opacity="0.92">
      AI • Spring Boot • React • PostgreSQL
    </text>
  </g>
</svg>
